<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id = "wgg-netbar">
        <div class = "wgg-netbar__left">
            <div class = "wgg-netbar__logo">
                <a href="/" aria-label="wiki.gg">
				    <img height="25" alt="wiki.gg logo" src="images/logo.svg">
			    </a>
            </div>

            <a class="wgg-netbar__deals-link" href="https://www.indiedeals.gg" target="_blank" rel="noopener" title="Indie game deals">
			    <img class="wgg-netbar__deals-link__icon" src="images/indiedeals_logo.png" alt="">
			    <span class="wgg-netbar__deals-link__label">Indie game deals</span>
			</a>
        </div>

        <nav class = "wgg-netbar__user-links" aria-label="Personal tools">
            <div id="p-personal" class="mw-portlet-personal">
                <ul><li id="pt-themes" class="mw-list-item"><span class="ext-themetoggle-simple-icon" title="Current theme is &quot;Light&quot;. Tap to switch.">Current theme: Light</span></li>
		            <li id="pt-createaccount" class="mw-list-item wgg-netbar__desktop-only"><a data-mw="interface" class="" href="/wiki/Special:CreateAccount?returnto=Satisfactory+Wiki" title="You are encouraged to create an account and log in; however, it is not mandatory"><span>Create account</span></a></li>
		            <li id="pt-login" class="mw-list-item wgg-netbar__desktop-only"><a data-mw="interface" class="" href="/wiki/Special:UserLogin?returnto=Satisfactory+Wiki" title="You are encouraged to log in; however, it is not mandatory [alt-shift-o]" accesskey="o"><span>Log in</span></a></li>
		        </ul>
            </div>   
            
        </nav>
    </header>

    <div id="mw-page-base" class="noprint"></div>
    <div id="mw-head-base" class="noprint"></div>

    <div class="content-wrapper">
        <div id="mw-navigation">
            <h2>Navigation menu</h2>
            <div id="mw-head">
                <div>Main page</div>
                <div>Discussion</div>
                <div>Read</div>
                <div>View source</div>
                <div>View history</div>
                <div>Search Satisfactory</div>
            </div>
            <div id="mw-panel"></div>
        </div>
    </div>

</body>
</html>
